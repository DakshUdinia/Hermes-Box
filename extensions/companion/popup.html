<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 360px; background: #0f111a; color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif; padding: 14px; margin: 0;
  }
  .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .hdr h3 { margin: 0; font-size: 14.5px; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .mini-btn {
    background: #1e2538; color: #cbd5e1; border: 1px solid #2d3753;
    border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer;
  }
  .mini-btn:hover { background: #2a344f; color: #fff; }
  .tab-list {
    max-height: 210px; overflow-y: auto; background: #151926;
    border: 1px solid #22293e; border-radius: 8px; padding: 6px; margin-bottom: 10px;
  }
  .tab-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 6px; cursor: pointer; font-size: 12.5px;
  }
  .tab-item:hover { background: #1e2538; }
  .tab-title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .opts {
    background: #151926; border: 1px solid #22293e; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 10px; font-size: 12px;
  }
  .opt-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; }
  .btn {
    width: 100%; border: none; border-radius: 8px; padding: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; margin-bottom: 6px;
  }
  .btn.primary { background: #6366f1; }
  .btn.primary:hover { background: #4f46e5; }
  .btn.secondary { background: #262f45; color: #e2e8f0; }
  .btn.secondary:hover { background: #333f5c; }
  #statusMsg { font-size: 11.5px; color: #10b981; text-align: center; min-height: 16px; }
</style>
</head>
<body>
  <div class="hdr">
    <h3>🛡️ Send Tabs to Hermes Box</h3>
    <span style="font-size:11px; color:#94a3b8;" id="selCount">1 selected</span>
  </div>

  <div class="toolbar">
    <button class="mini-btn" id="selActive">Active Tab</button>
    <button class="mini-btn" id="selAll">Select All</button>
    <button class="mini-btn" id="selNone">Clear</button>
  </div>

  <div class="tab-list" id="tabList"></div>

  <div class="opts">
    <label class="opt-row">
      <span>🛡️ uBlock Origin (Always On in Sandbox)</span>
      <input type="checkbox" id="chkUblock" checked disabled>
    </label>
    <label class="opt-row">
      <span>🌐 Enable 1ClickVPN Proxy in Sandbox</span>
      <input type="checkbox" id="chkVpn" checked>
    </label>
    <label class="opt-row">
      <span>🧹 Close selected tabs here after sending</span>
      <input type="checkbox" id="chkCloseAfter">
    </label>
  </div>

  <button class="btn primary" id="launchBlankBtn">⚡ Launch Fresh Empty Sandbox</button>
  <button class="btn primary" style="background:#10b981;" id="launchSelBtn">🚀 Open Selected Tabs in Sandbox</button>
  <button class="btn secondary" id="openGuiBtn">🎛️ Open Hermes Box Control Center</button>
  <div id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
